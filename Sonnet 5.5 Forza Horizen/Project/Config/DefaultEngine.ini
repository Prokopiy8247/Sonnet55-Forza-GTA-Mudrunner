; ----------------------------------------------------------------------------------------------------------------------
; Collision (Docs/ARCHITECTURE.md section 7). Names are mirrored in Source/Sonnet55Forza/Core/RoamCollision.h - keep in sync.
; Object channels: Roam_Vehicle (GameTraceChannel1), Roam_Traffic (2), Roam_Pickup (3).
; Trace channels:  Roam_Wheel (4) wheel/suspension/ground rays, Roam_Camera (5) camera probes (both default to Ignore, RoamWorldStatic blocks).
; ----------------------------------------------------------------------------------------------------------------------
[/Script/Engine.CollisionProfile]
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False,Name="Roam_Vehicle")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False,Name="Roam_Traffic")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel3,DefaultResponse=ECR_Ignore,bTraceType=False,bStaticObject=False,Name="Roam_Pickup")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel4,DefaultResponse=ECR_Ignore,bTraceType=True,bStaticObject=False,Name="Roam_Wheel")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel5,DefaultResponse=ECR_Ignore,bTraceType=True,bStaticObject=False,Name="Roam_Camera")
; RoamVehicle: the car body. Blocks the world, other cars and traffic; overlaps pickups; invisible to the wheel and camera rays.
+Profiles=(Name="RoamVehicle",CollisionEnabled=QueryAndPhysics,bCanModify=True,ObjectTypeName="Roam_Vehicle",CustomResponses=((Channel="WorldStatic",Response=ECR_Block),(Channel="WorldDynamic",Response=ECR_Block),(Channel="Pawn",Response=ECR_Overlap),(Channel="Visibility",Response=ECR_Block),(Channel="Camera",Response=ECR_Ignore),(Channel="PhysicsBody",Response=ECR_Block),(Channel="Vehicle",Response=ECR_Block),(Channel="Destructible",Response=ECR_Block),(Channel="Roam_Vehicle",Response=ECR_Block),(Channel="Roam_Traffic",Response=ECR_Block),(Channel="Roam_Pickup",Response=ECR_Overlap),(Channel="Roam_Wheel",Response=ECR_Ignore),(Channel="Roam_Camera",Response=ECR_Ignore)),HelpMessage="Roamline player/AI car body")
; RoamTraffic: civilian cars. Block the world and the player's car; ignore each other (lane followers) and all rays.
+Profiles=(Name="RoamTraffic",CollisionEnabled=QueryAndPhysics,bCanModify=True,ObjectTypeName="Roam_Traffic",CustomResponses=((Channel="WorldStatic",Response=ECR_Block),(Channel="WorldDynamic",Response=ECR_Block),(Channel="Pawn",Response=ECR_Ignore),(Channel="Visibility",Response=ECR_Block),(Channel="Camera",Response=ECR_Ignore),(Channel="PhysicsBody",Response=ECR_Block),(Channel="Vehicle",Response=ECR_Ignore),(Channel="Destructible",Response=ECR_Block),(Channel="Roam_Vehicle",Response=ECR_Block),(Channel="Roam_Traffic",Response=ECR_Ignore),(Channel="Roam_Pickup",Response=ECR_Ignore),(Channel="Roam_Wheel",Response=ECR_Ignore),(Channel="Roam_Camera",Response=ECR_Ignore)),HelpMessage="Roamline civilian traffic car")
; RoamWorldStatic: roads, terrain, buildings. Blocks everything including the wheel and camera rays; pickups pass.
; IMPORTANT: Roam_Wheel and Roam_Camera default to IGNORE (see above), so that pawns, characters, spectators and props never
; intercept the ground rays of the vehicle model. Everything that is DRIVABLE or must block the camera (landscape, road meshes,
; terrain, buildings, rocks) therefore has to use this profile (or answer Block to those two channels explicitly).
+Profiles=(Name="RoamWorldStatic",CollisionEnabled=QueryAndPhysics,bCanModify=True,ObjectTypeName="WorldStatic",CustomResponses=((Channel="Roam_Vehicle",Response=ECR_Block),(Channel="Roam_Traffic",Response=ECR_Block),(Channel="Roam_Pickup",Response=ECR_Ignore),(Channel="Roam_Wheel",Response=ECR_Block),(Channel="Roam_Camera",Response=ECR_Block)),HelpMessage="Roamline static world: blocks cars and the wheel/camera rays")
; RoamPickup: collectibles - overlap the player's car only.
+Profiles=(Name="RoamPickup",CollisionEnabled=QueryOnly,bCanModify=True,ObjectTypeName="Roam_Pickup",CustomResponses=((Channel="WorldStatic",Response=ECR_Ignore),(Channel="WorldDynamic",Response=ECR_Ignore),(Channel="Pawn",Response=ECR_Ignore),(Channel="Visibility",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore),(Channel="PhysicsBody",Response=ECR_Ignore),(Channel="Vehicle",Response=ECR_Ignore),(Channel="Destructible",Response=ECR_Ignore),(Channel="Roam_Vehicle",Response=ECR_Overlap),(Channel="Roam_Traffic",Response=ECR_Ignore),(Channel="Roam_Pickup",Response=ECR_Ignore),(Channel="Roam_Wheel",Response=ECR_Ignore),(Channel="Roam_Camera",Response=ECR_Ignore)),HelpMessage="Roamline collectible")

; ----------------------------------------------------------------------------------------------------------------------
; Physics (see Docs/Tech/BUILD_AND_RUN.md "Physics stepping" for the verified reasoning)
;
; DECISION: asynchronous fixed-step physics at 120 Hz.
;  * The project-owned vehicle model must run its suspension / tyre / drivetrain integration at a small, FIXED step to stay
;    stable at 250+ km/h with stiff springs. In 5.8.2 FBodyInstance::AddCustomPhysics is no longer a per-substep hook with Chaos
;    (it runs once per frame with the frame delta), but UActorComponent::AsyncPhysicsTickComponent is called before EVERY solver
;    step with the solver's dt. With bTickPhysicsAsync the solver uses the fixed AsyncFixedTimeStepSize, so the vehicle always gets
;    exactly 1/120 s regardless of the render frame rate (60 FPS -> 2 steps per frame), and render results are interpolated.
;  * Sub-stepping is ALSO configured (max 1/120 s per substep, up to 8 substeps = survives a 15 FPS hitch without slowing time).
;    While bTickPhysicsAsync is true the solver ignores it (fixed dt wins); it takes over automatically if async is switched off,
;    and the same AsyncPhysicsTickComponent callback still fires per substep. Switching modes needs no code change.
; ----------------------------------------------------------------------------------------------------------------------
[/Script/Engine.PhysicsSettings]
; Fixed gravity, cm/s^2 (WorldSettings does not override it; jump distance maths in Docs/Tech/FH5_activities.md assumes this value).
DefaultGravityZ=-980.000000
bSubstepping=True
bSubsteppingAsync=False
bTickPhysicsAsync=True
AsyncFixedTimeStepSize=0.008333
MaxSubstepDeltaTime=0.008333
MaxSubsteps=8
; Longest simulated step per frame in sync mode (3 substeps worth) - after a long hitch the car must not explode.
MaxPhysicsDeltaTime=0.033333
bEnableEnhancedDeterminism=False
; Surface types = Roamline surfaces. PM_Roam_* physical materials use these; the order equals ERoamSurface (Core/RoamTypes.h).
+PhysicalSurfaces=(Type=SurfaceType1,Name="Asphalt")
+PhysicalSurfaces=(Type=SurfaceType2,Name="Concrete")
+PhysicalSurfaces=(Type=SurfaceType3,Name="Dirt")
+PhysicalSurfaces=(Type=SurfaceType4,Name="Gravel")
+PhysicalSurfaces=(Type=SurfaceType5,Name="Grass")
+PhysicalSurfaces=(Type=SurfaceType6,Name="Sand")
+PhysicalSurfaces=(Type=SurfaceType7,Name="Snow")
+PhysicalSurfaces=(Type=SurfaceType8,Name="Mud")

