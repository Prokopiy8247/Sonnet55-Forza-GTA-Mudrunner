r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8

r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8

; ----------------------------------------------------------------------------------------------------------------------
; Runtime console variables tuned for a stable 60 FPS open-world racer. They sit in [SystemSettings], which has a higher
; priority than the scalability groups (sg.*), so these values win over the Epic/High/Cinematic presets. Each value was
; checked to exist as a CVar in the 5.8.2 engine source; defaults in brackets.
; ----------------------------------------------------------------------------------------------------------------------
[SystemSettings]
; --- Lumen (software tracing; hardware RT would roughly double the GI/reflection cost and the project targets any DX12 GPU)
r.Lumen.HardwareRayTracing=0
; Lumen traces the lower-resolution global SDF instead of per-mesh SDFs: cheap with the high instance density of foliage. [0]
r.Lumen.TraceMeshSDFs=0
; Reflection rays at half resolution: the main performance control of Lumen reflections, hardly visible on a moving car. [1]
r.Lumen.Reflections.DownsampleFactor=2
; Screen-probe GI placement: one probe per 16x16 pixels, 8x8 rays (engine defaults, stated explicitly so a preset cannot raise them). [16 / 8]
r.Lumen.ScreenProbeGather.DownsampleFactor=16
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=8
; Translucency lighting grid, coarser (rain/spray particles, glass): saves ~0.3 ms. [32 = default]
r.Lumen.TranslucencyVolume.GridPixelSize=32

; --- Virtual Shadow Maps
; A larger page pool avoids missing shadow tiles with the long sun-shadow range of an open world at 250 km/h; costs ~270 MB. [2048]
r.Shadow.Virtual.MaxPhysicalPages=4096
; Fewer soft-shadow rays/samples for the sun: 4 rays x 6 samples instead of 7 x 8 (largest VSM cost at 1440p+). [7 / 8]
r.Shadow.Virtual.SMRT.RayCountDirectional=4
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=6

; --- Volumetrics
; Quarter-resolution cloud tracing reconstructed at half resolution - the cheapest mode and fine at speed. [0 = default]
r.VolumetricRenderTarget.Mode=0
; Volumetric fog froxels 16 px (default) - keep, fog bands are the weather's main visibility effect.
r.VolumetricFog.GridPixelSize=16

; --- Texture and Nanite streaming (large landscape + Nanite rocks/foliage)
; 3 GB texture pool, but never more than the GPU has. [-1 = engine default ~1 GB]
r.Streaming.PoolSize=3000
r.Streaming.LimitPoolSizeToVRAM=1
; Nanite streaming pool: 1 GB for dense rock/foliage geometry streamed at 70 m/s. [512]
r.Nanite.Streaming.StreamingPoolSize=1024
; Full Nanite detail (1 pixel per edge, engine default) - Nanite is cheap; lower quality only if profiling shows it. [1]
r.Nanite.MaxPixelsPerEdge=1

; --- World Partition
; If cell streaming cannot keep up, BLOCK for a moment instead of letting the car drive into unloaded terrain and fall through
; the world. A hitch is the lesser evil for a fast driving game. Levels use cells of 25600 uu and a loading range of 76800 uu
; (set by the world builder per level, ~1.1 s of warning at 250 km/h). [1]
wp.Runtime.BlockOnSlowStreaming=1

; --- Post
; Full-quality motion blur sells the sense of speed; the camera owner may scale it. [4]
r.MotionBlurQuality=4

